# Its own workspace root, so this repository builds on its own.
[workspace]

[package]
name = "xmip-core-library-mariadb"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/IlleNilsson/xmip-core-library-mariadb"
description = "The MariaDB client/server protocol, both halves: framing, the protocol-41 login and authentication switch, OK, ERR, EOF and text result sets, the native password, a client over TLS where asked, and the far end a test serves."
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# The estate's encoding primitives: the byte cursor and writer the fields
# are read and written over, SHA-1 for the native password, the random
# nonce a far end greets with, and the constant-time comparison.
codec = { package = "xmip-core-library-codec", git = "https://github.com/IlleNilsson/xmip-core-library-codec", branch = "main" }
# The connection opened inside one deadline (`net::connect`), the ceiling a
# payload's packets are joined under (`net::MAX_BODY`), and the error a
# refusal travels in, a connection's keeping its kind.
net = { package = "xmip-core-library-net", git = "https://github.com/IlleNilsson/xmip-core-library-net", branch = "main" }
# SQL: the MariaDB dialect a far end takes an INSERT apart in, and a
# statement's verb.
sql = { package = "xmip-core-library-sql", git = "https://github.com/IlleNilsson/xmip-core-library-sql", branch = "main" }
# The estate's TLS, which a login is upgraded to in place after the
# client's SSL request (ADR-0033).
tls = { package = "xmip-core-library-tls", git = "https://github.com/IlleNilsson/xmip-core-library-tls", branch = "main" }

[dev-dependencies]
# A self-signed certificate for the guarded login's test, as the TLS
# library's own tests make one. Test-only.
rcgen = "0.13"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
too_many_lines = "warn"
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "warn"
missing_panics_doc = "warn"
unwrap_used = "warn"
expect_used = "allow"

[profile.dev.package."*"]
opt-level = 3
